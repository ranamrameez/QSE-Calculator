name: Update QSE prices

on:
  schedule:
    # 10:30 UTC = 13:30 Asia/Qatar, ~15 min after QSE's 13:15 close.
    # Cron day-of-week: 0=Sun ... 4=Thu (QSE trades Sun-Thu).
    - cron: '30 10 * * 0-4'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit prices.json if changed
        run: |
          git config user.name "qse-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update QSE prices [skip ci]"
          git push
